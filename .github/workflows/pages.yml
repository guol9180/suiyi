name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # OSS 镜像凭据：提到 job 级是为了让 step 的 if 能读（GitHub 不允许在
      # step 的 if 里直接读 secrets）。没配时 OSS 步骤自动跳过，Pages 镜像兜底
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 把最新一版的安装包同步到下载页目录：GitHub 的 release 资产落在
      # objects.githubusercontent.com 上，国内经常连不上；镜像到自己的域名下更稳。
      # 应用内的「下载并安装」优先试 OSS 镜像，再试这份 Pages 镜像与 GitHub 直链。
      - name: 镜像最新安装包
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = "docs/dl"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($n in @("SuiYi-Setup-x64.exe")) {
            $url = "https://github.com/guol9180/suiyi/releases/latest/download/$n"
            try {
              Invoke-WebRequest -Uri $url -OutFile (Join-Path $dir $n) -TimeoutSec 600
              Write-Host "已镜像 $n"
            } catch {
              Write-Warning "跳过 $n：$_"
            }
          }
          Get-ChildItem $dir | Select-Object Name, Length
      # 阿里云 OSS 是国内可达性的主力源：Pages（Fastly 185.199 段）持续传输实测
      # 只有 ~60KB/s（12 连接也是它，线路总带宽封顶），OSS 直链预期快一个量级。
      # ossutil v2 认 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 环境变量；
      # secrets 未配置（OSS_READY 未开或 AK 为空）时整步跳过，Pages 镜像兜底
      - name: 镜像到阿里云 OSS
        if: ${{ vars.OSS_READY == 'true' && env.OSS_ACCESS_KEY_ID != '' }}
        continue-on-error: true
        env:
          OSS_OBJECT: SuiYi-Setup-x64.exe
        shell: bash
        run: |
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/2.1.1/ossutil-2.1.1-linux-amd64.zip"
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil
          chmod +x /tmp/ossutil/ossutil-2.1.1-linux-amd64/ossutil
          /tmp/ossutil/ossutil-2.1.1-linux-amd64/ossutil cp \
            "docs/dl/$OSS_OBJECT" "oss://$OSS_BUCKET/$OSS_OBJECT" \
            --endpoint "$OSS_ENDPOINT" --force
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
