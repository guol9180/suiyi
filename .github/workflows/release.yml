name: Release

# 打 tag（v*）时在 GitHub 的 Windows 机器上构建安装包并发布；
# 也可以在 Actions 页面手动触发，产物会挂到该次运行的 Artifacts 上。
#
# 结构：测试与构建**并行**跑（各自独立缓存），发布等两者都成功才执行——
# 串行时代总耗时 = 测试 + 构建，并行后 = max(测试, 构建) + 发布步。
#
# 缓存（2026-10 重设计）：直接用 actions/cache 管 src-tauri/target，键里**不含
# Cargo.lock 哈希**，restore-keys 前缀回退到最近一次的产物，由 cargo 指纹裁决
# 增量复用。此前用 rust-cache：它的键含 Cargo.lock 哈希且没有回退链，而发版必
# bump 版本号 → lockfile 必变 → 键必失配 → 每次发版全量重编（v0.10.6 实测
# cargo 自报 11m24s，而 NSIS+MSI 打包仅 40s——慢的从来不是打包器）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一分支/标签还有没跑完的旧跑批时直接取消，不重复消耗构建机
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # 发版后要触发一次 Pages 部署，把新安装包同步到下载页的 /dl 镜像目录
  actions: write

env:
  # 锁定工具链版本：Rust 构建缓存的键含 rustc 版本，漂浮的 stable 会让隔段时间
  # 的发布缓存全失配、退回全量重编（v0.10.4 实测总耗时 17.5 分钟）。
  # 升级 Rust 时顺手改这里：改完首轮全量编一次，之后恢复增量。
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  # ---------- 后端测试（与构建并行） ----------
  test:
    name: 后端测试
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # 键随 run_id 滚动（每次保存新条目），restore-keys 回退到最近一条；
      # cargo 自己按指纹复用未变的依赖产物。与构建 job 的缓存互相独立
      - name: 缓存 Rust 构建
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ github.run_id }}
          restore-keys: |
            cargo-test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      # OCR 模型与 ONNX Runtime 约 34MB，按哈希缓存，避免每次 CI 重新下载
      - name: 缓存 OCR 模型
        uses: actions/cache@v4
        with:
          path: src-tauri/ocr
          key: ocr-assets-v1-${{ runner.os }}-${{ hashFiles('scripts/fetch-ocr-assets.mjs') }}

      # 纯 Node 脚本、零 npm 依赖：runner 自带 node，直接跑，
      # 省掉 pnpm/node 安装与前端依赖安装（拉模型只为编译进测试资源）
      - name: 拉取 OCR 模型
        run: node scripts/fetch-ocr-assets.mjs

      # debug profile：无 LTO、无优化编译——测试二进制链接秒级。此前用
      # --release 与构建共用 profile，代价是每次发版把依赖按 release 优化
      # 编译一遍再扛一遍 LTO 链接（v0.10.6 实测该步 10m41s，而测试本身
      # 本地只要 2.3s）；缓存修好后 debug 依赖编一次永久复用，无需再省。
      # panic=unwind 也是测试框架的默认假设，与本地 cargo test 完全一致。
      - name: 运行后端测试
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test 2>&1 | Tee-Object -FilePath ../test-output.txt
          if ($LASTEXITCODE -ne 0) {
            # 把失败摘要发成注解：没有日志读取权限时也能在 check 上看到原因
            Get-Content ../test-output.txt |
              Select-String -Pattern 'panicked at|FAILED|assertion|test result: FAILED|error\[' |
              Select-Object -First 8 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }

  # ---------- 构建安装包（与测试并行） ----------
  build:
    name: 构建安装包
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # 键随 run_id 滚动，restore-keys 回退到最近一次：发版 bump 版本号只重编
      # suiyi 本体（含 thin-LTO 链接），几十个依赖产物经 cargo 指纹全量复用
      - name: 缓存 Rust 构建
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ github.run_id }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      # Tauri 打包器（NSIS 与 WiX）每次运行会现场下载到 %LOCALAPPDATA%\tauri，
      # 缓存后省掉每次发版的下载时间
      - name: 缓存打包器工具
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}

      - name: 缓存 OCR 模型
        uses: actions/cache@v4
        with:
          path: src-tauri/ocr
          key: ocr-assets-v1-${{ runner.os }}-${{ hashFiles('scripts/fetch-ocr-assets.mjs') }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 拉取 OCR 模型
        run: pnpm ocr:assets

      - name: 构建安装包
        run: pnpm tauri build

      # 把产物名归一化，这样下载链接可以固定成
      # https://github.com/<owner>/<repo>/releases/latest/download/<name>
      # 产物收敛：Windows 只发 NSIS exe；源码包由 GitHub Release 自动生成
      - name: 归一化产物名
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-release/SuiYi-Setup-x64.exe
          Get-ChildItem dist-release | Select-Object Name, Length

      - name: 上传构建产物
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: suiyi-windows-x64
          path: dist-release/*

  # ---------- 发布（等测试与构建都成功） ----------
  release:
    name: 发布
    needs: [test, build]
    runs-on: ubuntu-latest
    env:
      # 签名凭据提到 job 级 env：GitHub 不允许在 step 的 if 里直接读 secrets，
      # 只能先放进 env，再用 env.XXX 判断（这也是之前工作流“0 个 job 直接失败”的原因）。
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # npm 发布凭据（npmmirror 主源，见「发布 npm 包」步骤）与包名常量
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_PACKAGE: suiyi-setup-x64
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: suiyi-windows-x64
          path: dist-release

      # 发版说明 = annotated tag 的 message：打 tag 时写清「更新了什么、修复了什么」，
      # 这里原样取出来当 Release 正文（不再写死「安装包是什么」的介绍）。
      #
      # 走 API 而不是本地 git：checkout 的引用式拉取不保证带 annotated tag 对象，
      # 本地 `git tag -l --format='%(contents)'` 会退化成 commit message（v0.10.8
      # 实测，fetch-depth:0 + fetch-tags 也一样）；顺手不再 checkout——它会把
      # 工作区清空，v0.10.7 首发资产为空就是它清掉了 dist-release。
      # 轻量 tag 没有 message（API 返回空），回退一句引导 + 自动变更列表
      - name: 读取发版说明（tag message）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.message' > release-body.md
          if [ ! -s release-body.md ]; then
            echo "本次更新内容见下方自动生成的变更列表。" > release-body.md
          fi

      # 代码签名（SignPath Foundation，申请与配置见 docs/signing.md）。
      # SIGNPATH_READY 还是 false、或仓库里没配 SIGNPATH_API_TOKEN 时整段跳过，
      # 未签名的包照常发布；审核通过后把 SIGNPATH_READY 改成 true 并填上四个 slug 即可。
      - name: 提交签名请求（SignPath）
        id: signpath
        if: ${{ vars.SIGNPATH_READY == 'true' && env.SIGNPATH_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_TOKEN }}
          organization-id: "<-- 填这里：organization id"
          project-slug: "<-- 填这里：project slug"
          signing-policy-slug: "<-- 填这里：signing policy slug"
          artifact-configuration-slug: "<-- 填这里：artifact configuration slug"
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: 说明签名状态
        if: ${{ vars.SIGNPATH_READY != 'true' || env.SIGNPATH_TOKEN == '' }}
        run: echo "::notice::本次未签名（SignPath 尚未接入，见 docs/signing.md）"

      # 签名产物优先：拿到签名版就覆盖掉待发布的未签名文件
      - name: 用已签名产物替换
        if: ${{ steps.signpath.outcome == 'success' }}
        run: |
          if [ -d signed ]; then
            cp -rv signed/* dist-release/
          fi
          ls -la dist-release

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          # 同名资产直接覆盖：重打同一个 tag（比如修完工作流重发）时不会留下旧产物
          overwrite_files: true
          generate_release_notes: true
          body_path: release-body.md

      # 把安装包发布成 npm 包（package/SuiYi-Setup-x64.exe），npmmirror 会自动
      # 同步到阿里云 CDN——那是应用内更新的主力源：Pages 与 GitHub 同走 Fastly，
      # 持续传输实测只有 ~60KB/s（12 连接也是它，线路总带宽封顶）。
      # NPM_TOKEN 未配置时整步跳过；同版本重发（重打同一 tag）时视为已成功
      - name: 发布 npm 包（npmmirror 主源）
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/package
          cp dist-release/SuiYi-Setup-x64.exe pkg/package/
          printf '{
            "name": "%s",
            "version": "%s",
            "description": "SuiYi Windows installer (NSIS)",
            "license": "MIT",
            "files": ["SuiYi-Setup-x64.exe"]
          }
          ' "$NPM_PACKAGE" "$version" > pkg/package/package.json
          # npm 不允许同版本覆盖：已发布过（重打同一 tag）就视为成功跳过
          if npm view "$NPM_PACKAGE@$version" version >/dev/null 2>&1; then
            echo "::notice::npm 包 $version 已存在，跳过发布"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > pkg/.npmrc
          cd pkg/package
          npm publish --access public
          # 主动通知 npmmirror 立刻同步（默认轮询有几分钟延迟）；失败不影响发版
          curl -s -X PUT "https://registry-direct.npmmirror.com/-/package/$NPM_PACKAGE/syncs" || true

      # 新版本发布后立刻重跑一次 Pages：下载页会把最新安装包同步到 /dl/，
      # 应用内的「下载并安装」优先走这份国内镜像。
      - name: 刷新下载页镜像
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" -f ref=main
          echo "已触发 Pages 部署"
