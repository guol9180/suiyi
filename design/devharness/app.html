<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>随译 · 界面渲染桩</title>
    <script>
      /*
       * 界面验收用的本地渲染桩，不参与打包、不影响应用运行。
       *
       * 用法：pnpm exec vite --port 4181 --strictPort
       *      浏览器打开 http://localhost:4181/dist/app.html
       *
       * 参数：
       *   ?win=main|popup|overlay   渲染主窗口（默认）、划词弹窗或截图框选覆盖层
       *   #services #history #plugins #hotkey #general #about   直接跳到某页
       *   ?demo=translate   主窗口填入原文并触发一次翻译
       *   ?conflict=1       让「截图识别」显示为被占用，用来看冲突提示
       */
      (function () {
        var q = new URLSearchParams(location.search);
         var isPopup = q.get("win") === "popup";
        var isOverlay = q.get("win") === "overlay";
        var conflict = q.get("conflict") === "1";
        var failOne = q.get("fail") === "1";
        // ?ankioff=1 让 Anki 探测失败，用来看「待同步 / 自动排队」那套状态
        var ankiOk = q.get("ankioff") !== "1";

        // 覆盖层要一张「冻结帧」当背景，桩里画一张文档样子的图顶着
        var OVERLAY_SHOT =
          "data:image/svg+xml;utf8," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800">' +
              '<rect width="1280" height="800" fill="#c9cdd4"/>' +
              '<rect x="150" y="70" width="980" height="660" rx="8" fill="#ffffff"/>' +
              '<rect x="196" y="120" width="520" height="26" rx="4" fill="#2f3237"/>' +
              '<rect x="196" y="176" width="880" height="12" rx="6" fill="#c3c8d0"/>' +
              '<rect x="196" y="204" width="840" height="12" rx="6" fill="#c3c8d0"/>' +
              '<rect x="196" y="232" width="860" height="12" rx="6" fill="#c3c8d0"/>' +
              '<rect x="196" y="272" width="430" height="14" rx="6" fill="#3964fe" opacity=".28"/>' +
              '<rect x="196" y="308" width="856" height="12" rx="6" fill="#c3c8d0"/>' +
              '<rect x="196" y="336" width="820" height="12" rx="6" fill="#c3c8d0"/>' +
              '<rect x="196" y="364" width="870" height="12" rx="6" fill="#c3c8d0"/>' +
              '<rect x="196" y="404" width="700" height="12" rx="6" fill="#c3c8d0"/>' +
              '<rect x="196" y="432" width="840" height="12" rx="6" fill="#c3c8d0"/>' +
            "</svg>",
          );

        var SERVICES = {
          version: 1, concurrency: 2, timeoutSecs: 15, inputTargetLang: "中文",
          ankiUrl: "http://127.0.0.1:8765", ankiDeck: "随译生词",
          services: [
            { id: "zai", name: "ZAI", kind: "translation", protocol: "open_ai_compatible", enabled: true,
              baseUrl: "https://api.z.ai/api/paas/v4", model: "glm-5.3-flash", promptTemplate: null,
              temperature: 0.3, stream: true, resultType: "text", order: 0 },
            { id: "deepseek", name: "DeepSeek", kind: "translation", protocol: "open_ai_compatible", enabled: true,
              baseUrl: "https://api.deepseek.com/v1", model: "deepseek-chat", promptTemplate: null,
              temperature: 0.3, stream: true, resultType: "text", order: 1 },
            { id: "glm", name: "智谱 GLM", kind: "translation", protocol: "open_ai_compatible", enabled: false,
              baseUrl: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4-flash", promptTemplate: null,
              temperature: 0.3, stream: true, resultType: "text", order: 2 },
          ],
        };
        var TRANSLATED = {
          zai: { text: "敏捷的棕色狐狸跳过了那只懒狗。", elapsedMs: 900 },
          deepseek: { text: "那只敏捷的棕色狐狸一跃而过懒狗。", elapsedMs: 1100 },
        };
        // 后端 created_at 是毫秒，这里也按毫秒给，否则时间筛选会得到错误结果
        var NOW = Date.now();
        var HISTORY = [
          { id: 1, createdAt: NOW - 3600e3, kind: "selection", source: "Despite their success, transformers still struggle with long-context reasoning.", translated: "尽管取得了成功，Transformer 在处理长上下文推理时仍显吃力。", serviceName: "ZAI", elapsedMs: 900, ok: true },
          { id: 2, createdAt: NOW - 26 * 3600e3, kind: "screenshot", source: "The quick brown fox jumps over the lazy dog.", translated: "敏捷的棕色狐狸跳过了那只懒狗。", serviceName: "DeepSeek", elapsedMs: 1100, ok: true },
          { id: 3, createdAt: NOW - 50 * 3600e3, kind: "input", source: "请把这句话翻译成英文，谢谢。", translated: "", serviceName: "智谱 GLM", elapsedMs: 15000, ok: false, error: "请求超时：15 秒内没有响应" },
          { id: 4, createdAt: NOW - 12 * 86_400e3, kind: "manual", source: "Streaming responses reduce perceived latency.", translated: "流式响应会降低用户感知到的延迟。", serviceName: "ZAI", elapsedMs: 780, ok: true },
        ];
        var PLUGINS = [
          { id: "local-glossary", name: "术语表优先", version: "0.1.0", description: "命中自定义术语表时直接返回译文。", author: "随译", kind: "translation", permissions: ["clipboard:read"], dir: "C:\\Users\\PC\\AppData\\Roaming\\com.suiyi.dev\\plugins\\local-glossary", main: "main.js", enabled: true, ok: true, error: null },
          { id: "copy-markdown", name: "复制为 Markdown", version: "0.1.0", description: "把原文与译文拼成 Markdown 引用块放进剪贴板。", author: "随译", kind: "action", permissions: ["clipboard:write"], dir: "C:\\Users\\PC\\AppData\\Roaming\\com.suiyi.dev\\plugins\\copy-markdown", main: "main.js", enabled: false, ok: true, error: null },
        ];
        var HOTKEYS = [
          { id: "selection", label: "划词翻译", accelerator: "alt+d", registered: true, error: null, custom: false },
          { id: "screenshot", label: "截图识别", accelerator: "alt+s",
            registered: !conflict, error: conflict ? "该组合已被其他程序占用" : null, custom: false },
          { id: "input", label: "输入框转译", accelerator: "alt+t", registered: true, error: null, custom: false },
        ];
        function setHotkeyStub(args) {
          var hit = HOTKEYS.filter(function (h) { return h.id === args.id; })[0];
          if (hit) {
            hit.accelerator = String(args.accelerator).toLowerCase();
            hit.custom = true;
            hit.registered = true;
            hit.error = null;
          }
          return HOTKEYS;
        }
        function resetHotkeysStub() {
          var defs = { selection: "alt+d", screenshot: "alt+s", input: "alt+t" };
          HOTKEYS.forEach(function (h) { h.accelerator = defs[h.id]; h.custom = false; h.registered = true; h.error = null; });
          return HOTKEYS;
        }

        var MOCK = {
          list_services: function () { return SERVICES; },
          get_settings: function () { return { concurrency: 2, timeoutSecs: 15, inputTargetLang: "中文", ankiUrl: "http://127.0.0.1:8765", ankiDeck: "随译生词" }; },
          get_api_key: function () { return "sk-xxxxxxxxxxxxxxxxxxxx"; },
          list_plugins: function () { return PLUGINS; },
          plugins_dir_path: function () { return "C:\\Users\\PC\\AppData\\Roaming\\com.suiyi.dev\\plugins"; },
          list_history: function () { return HISTORY; },
          anki_status: function () {
            return ankiOk
              ? { available: true, version: 6, deckExists: true, error: null }
              : { available: false, version: null, deckExists: false, error: "连接 Anki 失败: 拒绝连接" };
          },
          wordbook_list: function () { return bookView(); },
          wordbook_add: wordbookAddStub,
          wordbook_sync: wordbookSyncStub,
          wordbook_remove: function (args) {
            WORDS = WORDS.filter(function (w) { return w.id !== args.id; });
            return bookView();
          },
          hotkey_status: function () { return HOTKEYS; },
          retry_hotkeys: function () { return HOTKEYS; },
          set_hotkey: setHotkeyStub,
          reset_hotkeys: resetHotkeysStub,
          speak_text: function () { return null; },
          stop_speaking: function () { return null; },
          test_connection: function () { return { ok: true, elapsedMs: 412, models: ["glm-5.3-flash"], error: null }; },
          get_screenshot: function () { return { dataUrl: OVERLAY_SHOT }; },
          finish_region: function () { return null; },
          cancel_screenshot: function () { return null; },
          translate_text: function (args) {
            if (failOne && args.serviceId === "deepseek") {
              throw new Error("服务返回 429：当前分组上游负载已饱和，请稍后再试");
            }
            var o = TRANSLATED[args.serviceId] || { text: "（无模拟结果）", elapsedMs: 500 };
            return { serviceId: args.serviceId, text: o.text, elapsedMs: o.elapsedMs };
          },
        };

        // 生词本桩：数据形状与 src-tauri/src/wordbook.rs 的 WordEntry 一致，
        // 这样界面上的每个状态（已同步 / 待同步 / 重复 / 失败）都能真的走到
        var WORDS = [
          { id: 3, createdAt: Date.now() - 3600 * 1000, term: "retrieval", reading: "",
            meaning: "检索", source: "selection", syncedAt: Date.now() - 3500 * 1000, noteId: 101 },
          { id: 2, createdAt: Date.now() - 7200 * 1000, term: "ablations", reading: "",
            meaning: "消融实验", source: "manual" },
          { id: 1, createdAt: Date.now() - 26 * 3600 * 1000, term: "lazy dog", reading: "",
            meaning: "懒狗", source: "input", syncedAt: Date.now() - 25 * 3600 * 1000, noteId: 88 },
        ];
        var wordSeq = 100;
        function bookView(extra) {
          var v = {
            entries: WORDS.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }),
            stats: {
              total: WORDS.length,
              pending: WORDS.filter(function (w) { return !w.syncedAt; }).length,
            },
            synced: false, duplicate: false, error: null,
          };
          if (extra) for (var k in extra) v[k] = extra[k];
          return v;
        }
        function wordbookAddStub(args) {
          var term = String(args.term || "").trim();
          var meaning = String(args.meaning || "").trim();
          if (!term || !meaning) throw new Error("词条或释义为空，无法加入生词本");
          var hit = WORDS.filter(function (w) {
            return w.term.toLowerCase() === term.toLowerCase()
              && w.meaning.toLowerCase() === meaning.toLowerCase();
          })[0];
          if (hit) return bookView({ duplicate: true, error: "这个词条已经在生词本里了" });
          // ankiOk=false 时只落本地，界面应显示待同步
          var entry = { id: ++wordSeq, createdAt: Date.now(), term: term, reading: "",
            meaning: meaning, source: args.source || "manual" };
          if (ankiOk) { entry.syncedAt = Date.now(); entry.noteId = 900 + entry.id; }
          WORDS.push(entry);
          return bookView({ synced: !!entry.syncedAt });
        }
        function wordbookSyncStub() {
          var n = 0;
          WORDS.forEach(function (w) {
            if (!w.syncedAt && ankiOk) { w.syncedAt = Date.now(); w.noteId = 900 + w.id; n++; }
          });
          return bookView({ synced: n > 0, error: ankiOk ? null : "连接 Anki 失败: 拒绝连接" });
        }

        var callbacks = {};
        var seq = 0;
        window.__TAURI_INTERNALS__ = {
          invoke: async function (cmd, args) {
            if (cmd === "plugin:event|listen") return 1;
            if (cmd === "plugin:event|unlisten") return null;
            if (cmd.indexOf("plugin:") === 0) return null;
            if (Object.prototype.hasOwnProperty.call(MOCK, cmd)) return MOCK[cmd](args);
            console.warn("[stub] 未模拟的命令:", cmd, args);
            return null;
          },
          transformCallback: function (fn) { seq += 1; callbacks[seq] = fn; return seq; },
          convertFileSrc: function (p) { return p; },
          metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        };

        function byText(sel, text) {
          return Array.prototype.slice.call(document.querySelectorAll(sel))
            .filter(function (e) { return (e.textContent || "").indexOf(text) >= 0; })[0];
        }

        window.addEventListener("load", function () {
          if (isPopup) {
            setTimeout(function () {
              Object.keys(callbacks).forEach(function (id) {
                try {
                  callbacks[id]({
                    event: "popup-set-source", id: Number(id),
                    payload: { text: "The quick brown fox jumps over the lazy dog.", autoTranslate: true, kind: "selection" },
                  });
                } catch (e) { console.warn(e); }
              });
            }, 400);
            return;
          }

          if (q.get("demo") === "translate") {
            setTimeout(function () {
              var ta = document.querySelector("textarea");
              if (!ta) return;
              var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
              setter.call(ta, "The quick brown fox jumps over the lazy dog.");
              ta.dispatchEvent(new Event("input", { bubbles: true }));
              setTimeout(function () {
                var btn = document.querySelector(".actions .btn.primary");
                if (btn) btn.click();
              }, 900);
            }, 600);
            return;
          }

          // 先跑一轮会失败的翻译，再切到设置页，用来看服务行的「上次失败」标记
          if (q.get("demo") === "failservices") {
            setTimeout(function () {
              var ta = document.querySelector("textarea");
              if (!ta) return;
              var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
              setter.call(ta, "The quick brown fox jumps over the lazy dog.");
              ta.dispatchEvent(new Event("input", { bubbles: true }));
              setTimeout(function () {
                var btn = document.querySelector(".actions .btn.primary");
                if (btn) btn.click();
                setTimeout(function () {
                  var tab = document.querySelectorAll(".tabbar button")[1];
                  if (tab) tab.click();
                  setTimeout(function () {
                    var item = byText(".side-item", "服务配置");
                    if (item) item.click();
                  }, 250);
                }, 1200);
              }, 600);
            }, 500);
            return;
          }

          var want = (location.hash || "").replace("#", "");
          if (!want) return;
          var SIDE = {
            general: "通用", hotkey: "热键", services: "服务配置",
            history: "历史记录", wordbook: "生词本", plugins: "插件", about: "关于",
          };
          setTimeout(function () {
            var t = document.querySelectorAll(".tabbar button")[1];
            if (t) t.click();
            setTimeout(function () {
              var label = SIDE[want];
              if (label) { var item = byText(".side-item", label); if (item) item.click(); }
            }, 150);
          }, 200);
        });

        // 无头浏览器有最小视口宽度，把弹窗钉回真实窗口宽度 430px
        if (isPopup) {
          var st = document.createElement("style");
          st.textContent = "html,body{background:#fff;margin:0;padding:0;overflow:hidden}" +
            ".popup-root{width:430px !important;height:540px !important}";
          document.head.appendChild(st);
        }

        // ?w=900&h=620：把应用钉在指定窗口尺寸里，用来复现真实窗口下的布局
        var w = q.get("w");
        var h = q.get("h");
        if (w && h) {
          var st2 = document.createElement("style");
          st2.textContent =
            "html,body{margin:0;padding:0;overflow:hidden;background:#fff}" +
            "#root>.app-shell{width:" + w + "px;height:" + h + "px;overflow:hidden;border:1px solid #d33}";
          document.head.appendChild(st2);
        }

        var scr = document.createElement("script");
        scr.type = "module";
        scr.src = isOverlay
          ? "/src/overlay-main.tsx"
          : isPopup
            ? "/src/popup-main.tsx"
            : "/src/main.tsx";
        document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(scr); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
