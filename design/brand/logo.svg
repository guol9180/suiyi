<!--
  随译 SuiYi · 品牌标记（唯一真源）

  内容取自一张外部概念图：气泡 + 译 + 星芒 + AI 徽章，双层纸叠。
  这里按产品现有语言重绘（品牌蓝家族的渐变、无高光、无投影），不描摹那张图的像素，
  所以概念图本身不入库，仓库里只有这一份矢量真源。

  色值
    气泡渐变  #855CFF → #4E74FE（品牌蓝主档）→ #3BA6FF，原图的紫→蔚蓝走向
    底层色块  #C9D6FF（原图青绿，映射到色雾里的淡靛）
    字形星芒  #FFFFFF
    AI 字母   #2B52E0（品牌蓝文字档，白底 5.73:1）

  几何（1024 画布）
    底层色块  x57 y179  w857 h677 rx106
    气泡      x111 y107 w857 h677 rx106，尾尖垂到 y≈917
    两层之间的缝用 mask 抠成透明（10 单位），不是画白描边。
    「译」字形 取 Noto Sans SC Bold 的轮廓，去掉被星芒替代的「讠」点。

  重新生成整套图标与 favicon：node design/brand/build.mjs
-->
