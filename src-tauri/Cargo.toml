[package]
name = "suiyi"
version = "0.9.1"
description = "随译 SuiYi · 桌面 AI 翻译助手"
authors = ["suiyi-dev"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "suiyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：内置系统托盘（右下角小图标），是后台常驻工具唯一的「一直在那儿」入口
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures-util = "0.3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rquickjs = "0.14.0"

[target.'cfg(windows)'.dependencies]
# PaddleOCR（PP-OCRv4）跑在 ONNX Runtime 上：中文与单行框选的识别质量比系统 OCR 高一大截
# 关掉它自带的 download-binaries/copy-dylibs：运行时由我们自己的 ocr/onnxruntime.dll 提供，
# 构建过程不联网，装到哪台机器也不会出现「找不到 DLL」。
paddle-ocr-rs = { version = "0.6.1", default-features = false }
# 版本必须和 paddle-ocr-rs 0.6.1 当年编译的那版一致：rc.13 把 Tensor/Session 的 API 换过，
# 直接升上去编不过。
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
# 只用来在交给 ort 之前探一次 DLL 能不能加载（ort 加载失败是 panic，release 下会带走整个进程）
libloading = "0.9"
windows = { version = "0.61", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Core",
    "Media_Ocr",
    "Media_SpeechSynthesis",
    "Storage",
    "Storage_Streams",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# thin LTO + 多代码单元：打包时间大约减半（7~8 分钟 → 3~4 分钟），
# 代价是体积多几百 KB —— 相对已经 20MB+ 的安装包可以忽略
codegen-units = 4
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
